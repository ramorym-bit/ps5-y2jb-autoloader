name: Build download0.dat artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-download0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Y2JB update package from the pinned, already-compiled payloads
        run: make all BUILD_TYPE=dev

      - name: Prepare download0 filesystem tree
        shell: bash
        run: |
          set -euo pipefail
          cache_dir='download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY='
          mkdir -p "$cache_dir"
          unzip -q y2jb_update.zip -d "$cache_dir"
          rm -f "$cache_dir/update-info.txt"
          test -s "$cache_dir/main.js"
          test -s "$cache_dir/ps5-unified-autoloader.elf"
          test -s "$cache_dir/elfldr-ps5-v0.27-b57d0e9.elf"
          test -s "$cache_dir/kexp-v0.8-24cf6e5.bin"

      - name: Create UFS2 image in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          run: |
            set -e
            truncate -s 336789504 download0.dat
            MD=$(mdconfig -a -t vnode -f "$(pwd)/download0.dat")
            trap 'umount /mnt 2>/dev/null || true; mdconfig -d -u "$MD" 2>/dev/null || true' EXIT
            newfs -O 2 -b 32768 -f 4096 /dev/${MD}
            mount /dev/${MD} /mnt
            cp -R download0/* /mnt/
            chmod -R 777 /mnt/*
            chmod 444 /mnt/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/splash.html
            umount /mnt
            mdconfig -d -u ${MD}
            trap - EXIT

      - name: Verify UFS2 image
        run: |
          test "$(stat -c '%s' download0.dat)" -eq 336789504
          file download0.dat

      - name: Upload download0.dat
        uses: actions/upload-artifact@v4
        with:
          name: download0-dat
          path: download0.dat
          if-no-files-found: error
          retention-days: 14
